<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jasper 的随笔</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one reading column; the post list when no #slug, the post itself otherwise. Same palette as /home/. */
:root {
  --paper: #fff6dc; --panel: #fffdf6; --ink: #1f2a44; --muted: #6b6a7a; --rule: #ecdcae; --tomato: #e8553e; --sky: #3d7be0; --code: #f6ecd0;
  --display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1b1a24; --panel: #23222e; --ink: #f3ead3; --muted: #a8a3b4; --rule: #36344a; --tomato: #ff7a62; --sky: #7aa7ff; --code: #2b2a38; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #1b1a24; --panel: #23222e; --ink: #f3ead3; --muted: #a8a3b4; --rule: #36344a; --tomato: #ff7a62; --sky: #7aa7ff; --code: #2b2a38; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.85 var(--body);
  padding-block: 28px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 680px; margin: 0 auto; min-width: 0; }
nav { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 28px; }
nav a { text-decoration: none; color: inherit; }
nav a:hover { color: var(--tomato); }
h1 { font: 400 clamp(30px, 5vw, 40px)/1.3 var(--display); margin: 0 0 6px; text-wrap: balance; }
.meta { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
article h2 { font: 400 26px/1.3 var(--display); margin: 36px 0 8px; }
article h3 { font-size: 19px; margin: 28px 0 6px; }
article a { color: var(--tomato); }
article code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
article pre { background: var(--code); padding: 14px 16px; border-radius: 10px; overflow-x: auto; font-size: 14px; line-height: 1.6; }
article pre code { background: none; padding: 0; }
article blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid var(--tomato); color: var(--muted); }
article img { max-width: 100%; border-radius: 10px; }
article table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 15px; }
article th, article td { border-bottom: 1px solid var(--rule); padding: 6px 10px; text-align: left; }
.list { list-style: none; padding: 0; margin: 0; }
.list li { padding: 14px 0; border-bottom: 1px dashed var(--rule); }
.list a { text-decoration: none; font-weight: 500; font-size: 18px; }
.list a:hover { color: var(--tomato); }
.list p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.list time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <nav><a href="/home/">← Jasper's Agent 观察</a><a href="/blog/">全部随笔</a></nav>
  <div id="view"><div class="empty">加载中…</div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const view = document.getElementById("view");
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* default theme */ }
let posts = [];
async function show() {
  const slug = decodeURIComponent(location.hash.slice(1));
  const post = posts.find((p) => p.slug === slug);
  if (!post) {
    document.title = "Jasper 的随笔";
    view.innerHTML = `<h1>随笔</h1>` + (posts.length
      ? `<ul class="list">${posts.map((p) => `<li><time>${esc(p.date)}</time><br><a href="#${encodeURIComponent(p.slug)}">${esc(p.title)}</a>${p.summary ? `<p>${esc(p.summary)}</p>` : ""}</li>`).join("")}</ul>`
      : `<div class="empty">还没开始写，写了会出现在这里 (ง •_•)ง</div>`);
    return;
  }
  document.title = `${post.title} · Jasper 的随笔`;
  view.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const md = await (await fetch(post.file, { cache: "no-cache" })).text();
    const body = md.replace(/^---\n[\s\S]*?\n---\n/, "");
    view.innerHTML = `<h1>${esc(post.title)}</h1><div class="meta">${esc(post.date)}</div><article>${DOMPurify.sanitize(marked.parse(body))}</article>`;
    scrollTo(0, 0);
  } catch (e) {
    view.innerHTML = '<div class="empty">这篇文章没加载出来，刷新试试</div>';
  }
}
(async () => {
  try { posts = await (await fetch("index.json", { cache: "no-cache" })).json(); } catch (e) { posts = []; }
  addEventListener("hashchange", show);
  show();
})();
</script>
</body>
</html>
